openapi: 3.0.3
info:
  title: Pontal API
  description: 社内ポータルシステム Pontal のAPI仕様
  version: 0.0.1
servers:
  - url: http://localhost:8092
tags:
  - name: me
    description: ログインユーザー情報
  - name: employees
    description: 社員管理
  - name: salary-slips
    description: 給与明細
  - name: audit-log-batches
    description: 監査ログエクスポート
paths:
  /api/me:
    get:
      tags: [me]
      summary: ログインユーザー情報取得
      description: セッション中の社員ID・権限(isSystemAdmin/isHrAdmin)を取得する
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/employees:
    get:
      tags: [employees]
      summary: 社員一覧取得
      description: >-
        登録済み社員(論理削除済みを除く)の一覧を検索・ページングして取得する。
        該当なし・範囲外のページを指定した場合も200で空配列を返す。
      operationId: listEmployees
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          required: false
          description: 名前・メールアドレス・部署の部分一致(大文字小文字を区別しない)
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [employees]
      summary: 社員登録
      description: >-
        新規社員を登録する(システム管理者のみ)。
        認証はCognitoで管理するため、登録時にCognitoユーザーの作成とemployee.cognito_subへの紐付けが必要。
        initialPasswordはCognitoユーザー作成用の初期パスワードとして扱う。
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/employees/{id}:
    get:
      tags: [employees]
      summary: 社員詳細取得
      description: 特定社員のプロフィール詳細を取得する(isHrAdminには給与明細への導線を表示)
      operationId: getEmployee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [employees]
      summary: 社員編集
      description: >-
        社員情報・ロールを編集する(システム管理者のみ)。全項目を丸ごと置き換える。
        権限チェックは存在チェックより先に行うため、権限が無い場合は対象が存在しなくても403を返す。
      operationId: updateEmployee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [employees]
      summary: 社員削除
      description: >-
        社員を論理削除する(システム管理者のみ)。自分自身を削除しようとした場合は403を返す。
        権限チェックは存在チェックより先に行う。
      operationId: deleteEmployee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/employees/{employeeId}/salary-slips:
    get:
      tags: [salary-slips]
      summary: 給与明細一覧取得
      description: 自分(isHrAdminは指定社員)の給与明細を年月ごとに一覧取得する
      operationId: listSalarySlips
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalarySlipSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salary-slips/{slipId}/download:
    get:
      tags: [salary-slips]
      summary: 給与明細ダウンロード
      description: 給与明細PDFをダウンロードする。成功時、監査ログにDOWNLOADを記録する。
      operationId: downloadSalarySlip
      parameters:
        - name: slipId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salary-slips:
    post:
      tags: [salary-slips]
      summary: 給与明細アップロード
      description: >-
        社員と対象年月を選択し、PDF1件をアップロードして給与明細を登録する(isHrAdminのみ、同期処理)。
        既存データ(同一employeeId+payMonth)がある場合は409を返し、overwrite=trueを付けて再送すると上書きする。
        成功時、監査ログにCREATEを記録する。
      operationId: uploadSalarySlip
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [employeeId, payMonth, file]
              properties:
                employeeId:
                  type: integer
                  format: int64
                payMonth:
                  type: string
                  pattern: "^\\d{4}-\\d{2}$"
                  description: 支給年月(YYYY-MM)
                file:
                  type: string
                  format: binary
                  description: 給与明細PDF(拡張子.pdf必須、1件のみ)
                overwrite:
                  type: boolean
                  default: false
                  description: 既存データを上書きする場合true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalarySlipUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/salary-slips/{slipId}:
    delete:
      tags: [salary-slips]
      summary: 給与明細削除
      description: 誤って登録した給与明細を削除する(isHrAdminのみ)。成功時、監査ログにDELETEを記録する。
      operationId: deleteSalarySlip
      parameters:
        - name: slipId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salary-slips/history:
    get:
      tags: [salary-slips]
      summary: アップロード履歴一覧取得
      description: 給与明細のアップロード履歴(誰が・いつ・誰の分の・何年月分をアップロードしたか)を一覧取得する(isHrAdminのみ)
      operationId: listSalarySlipUploadHistory
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalarySlipUploadHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit-log-batches:
    get:
      tags: [audit-log-batches]
      summary: 監査ログエクスポート一覧取得
      description: 給与明細・評価データの閲覧/DL履歴のエクスポートバッチ一覧を取得する(システム管理者のみ)
      operationId: listAuditLogBatches
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogExportBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit-log-batches/{batchId}/download:
    get:
      tags: [audit-log-batches]
      summary: 監査ログエクスポートダウンロード
      description: 監査ログエクスポート結果をダウンロードする。成功時、監査ログに記録する。
      operationId: downloadAuditLogBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    EmployeeId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Me:
      type: object
      properties:
        employeeId:
          type: integer
          format: int64
        name:
          type: string
        isSystemAdmin:
          type: boolean
        isHrAdmin:
          type: boolean

    EmployeeSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        position:
          type: string

    EmployeePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSummary"
        totalCount:
          type: integer
        next:
          type: integer
          nullable: true
          description: 次ページ番号(存在しない場合はnull)
        prev:
          type: integer
          nullable: true
          description: 前ページ番号(存在しない場合はnull)

    EmployeeDetail:
      type: object
      description: >-
        社員詳細。社員編集API(EmployeeUpdateRequest)の入力項目を初期表示できるよう、
        DB設計上のプロフィール項目を全て含む。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        position:
          type: string
        joinDate:
          type: string
          format: date
        gender:
          type: string
        age:
          type: integer
        birthplace:
          type: string
        imageUrl:
          type: string
        bio:
          type: string
        hobby:
          type: string
        selfQa:
          type: string
        isSystemAdmin:
          type: boolean
        isHrAdmin:
          type: boolean

    EmployeeCreateRequest:
      type: object
      required: [name, email, initialPassword, joinDate, department]
      properties:
        name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 255
        initialPassword:
          type: string
          description: >-
            Cognitoユーザー作成用の初期(仮)パスワード。DBには保存しない。
            パスワードポリシーを満たさない場合は400。本人は初回ログイン時に変更する必要がある。
        joinDate:
          type: string
          format: date
        department:
          type: string
          maxLength: 50
        position:
          type: string
          maxLength: 50
        isSystemAdmin:
          type: boolean
          default: false
        isHrAdmin:
          type: boolean
          default: false

    EmployeeUpdateRequest:
      type: object
      required: [name, joinDate, isSystemAdmin, isHrAdmin]
      properties:
        name:
          type: string
          maxLength: 50
        gender:
          type: string
          maxLength: 10
        age:
          type: integer
          minimum: 0
          maximum: 150
        birthplace:
          type: string
          maxLength: 50
        joinDate:
          type: string
          format: date
        department:
          type: string
          maxLength: 50
        position:
          type: string
          maxLength: 50
        image:
          type: string
          maxLength: 255
          description: 画像のS3オブジェクトキー(DBのimage_urlに保存される)
        bio:
          type: string
        hobby:
          type: string
          maxLength: 255
        selfQa:
          type: string
        isSystemAdmin:
          type: boolean
          description: 必須(省略すると権限が黙って外れるのを防ぐため)
        isHrAdmin:
          type: boolean
          description: 必須

    SalarySlipSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        payMonth:
          type: string
          pattern: "^\\d{4}-\\d{2}$"

    SalarySlipUploadResult:
      type: object
      description: 給与明細アップロードAPIの成功レスポンス
      properties:
        id:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        payMonth:
          type: string
          pattern: "^\\d{4}-\\d{2}$"

    SalarySlipUploadHistory:
      type: object
      description: アップロード履歴一覧の1件分(誰が・いつ・誰の分をアップロードしたか)
      properties:
        slipId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        payMonth:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        uploadedBy:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time

    AuditLogExportBatchStatus:
      type: string
      enum: [PROCESSING, COMPLETED, FAILED]

    AuditLogExportBatch:
      type: object
      properties:
        batchId:
          type: integer
          format: int64
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/AuditLogExportBatchStatus"
        recordCount:
          type: integer
