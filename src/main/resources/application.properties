server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5433/pontal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.pontal.dto
mybatis.configuration.map-underscore-to-camel-case=true

#.envファイル(環境変数)で注入
cognito.region=${COGNITO_REGION:ap-northeast-1}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:}

#アプリの起動時には、SQL(テーブル作成・データ投入)を実行しない(再起動でデータが消えたり、列の追加が反映されなかったりするため)
#開発用DBのテーブル作成とダミーデータは、docker-compose.ymlのPostgreSQL初期化で行う
#SQLのテストでは、テスト側で spring.sql.init.mode=always を指定して、下のschema.sqlとsrc/test/resources/data.sqlを流す
#フォルダの中を見るように指定
spring.sql.init.schema-locations=classpath:schema/*.sql

# AWS S3の設定
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:ap-southeast-2}
